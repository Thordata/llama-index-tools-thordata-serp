[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "llama-index-tools-thordata-serp"
version = "0.1.0"
description = "Thordata SERP tools for LlamaIndex agents."
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thordata" }]
keywords = ["llama-index", "serp", "search", "thordata"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "llama-index-core>=0.13.0,<0.15",
  "pydantic>=2.0,<3.0",
  "requests>=2.32,<3.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "pytest>=8,<9",
  "responses>=0.25,<1",
  "tomli>=2,<3; python_version < '3.11'",
  "twine>=7.0,<8.0",
]

[project.urls]
Homepage = "https://www.thordata.com"
Repository = "https://github.com/Thordata/llama-index-tools-thordata-serp"
Issues = "https://github.com/Thordata/llama-index-tools-thordata-serp/issues"

[tool.llamahub]
contains_example = true
import_path = "llama_index.tools.thordata_serp"

[tool.llamahub.class_authors]
ThordataSerpToolSpec = "Thordata"

[tool.hatch.build.targets.sdist]
include = ["llama_index/", "README.md", "LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]
artifacts = ["llama_index/tools/thordata_serp/serp-schema.snapshot.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
